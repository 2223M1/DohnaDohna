name: DohnaDohna source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node tools/verify-project.mjs
      - run: node tools/verify-public-source.mjs
# Real game DLLs are private inputs. Configure a separate protected build job
# only after this project has its own repository, secrets and host references.
